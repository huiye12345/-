<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的活动 - 社区志愿服务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #134E5E 0%, #71B280 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-header {
            margin-bottom: 30px;
        }
        .page-header h2 {
            color: white;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-0 { background: #ffc107; color: #333; }
        .status-1 { background: #17a2b8; color: white; }
        .status-2 { background: #28a745; color: white; }
        .status-3 { background: #dc3545; color: white; }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .points-earned {
            color: #28a745;
            font-weight: 600;
        }
        .back-link {
            margin-bottom: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>社区志愿服务管理系统</h1>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/request/list">需求大厅</a>
            <a href="/sos/list">紧急求助</a>
            <a href="/activity/list">公益活动</a>
            <a href="/reward/list">积分商城</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>我的活动</h2>
        </div>

        <div class="card">
            <div class="back-link">
                <a href="/activity/list">&larr; 返回活动列表</a>
            </div>
            
            <table th:if="${not #lists.isEmpty(records)}">
                <thead>
                    <tr>
                        <th>活动ID</th>
                        <th>状态</th>
                        <th>签到时间</th>
                        <th>完成时间</th>
                        <th>获得积分</th>
                        <th>报名时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${records}">
                        <td th:text="${record.activityId}"></td>
                        <td>
                            <span class="status-badge" th:classappend="'status-' + ${record.status}"
                                  th:text="${record.status == 0 ? '已报名' : (record.status == 1 ? '已签到' : (record.status == 2 ? '已完成' : '已取消'))}">
                            </span>
                        </td>
                        <td th:text="${record.signInTime != null ? #temporals.format(record.signInTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td th:text="${record.completeTime != null ? #temporals.format(record.completeTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td class="points-earned" th:text="${record.pointsEarned > 0 ? '+' + record.pointsEarned : '-'}"></td>
                        <td th:text="${#temporals.format(record.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <a th:href="@{/activity/detail/{id}(id=${record.activityId})}" class="btn btn-primary">查看</a>
                            <button th:if="${record.status == 0}" class="btn btn-warning" th:onclick="'signIn(' + ${record.activityId} + ')'">签到</button>
                            <button th:if="${record.status == 1}" class="btn btn-success" th:onclick="'complete(' + ${record.activityId} + ')'">完成</button>
                            <button th:if="${record.status == 0}" class="btn btn-danger" th:onclick="'cancel(' + ${record.activityId} + ')'">取消</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(records)}" class="empty-state">
                <h3>您还没有报名任何活动</h3>
                <p><a href="/activity/list">去浏览活动</a></p>
            </div>
        </div>
    </div>

    <script>
        function signIn(activityId) {
            if (confirm('确定要签到吗？')) {
                fetch('/activity/signin/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
        
        function complete(activityId) {
            if (confirm('确定要完成该活动吗？完成后将获得积分奖励。')) {
                fetch('/activity/complete/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
        
        function cancel(activityId) {
            if (confirm('确定要取消报名吗？')) {
                fetch('/activity/cancel/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
    </script>
</body>
</html>
