<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分商城管理 - 社区志愿服务管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #333;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: white; }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .page-title {
            color: white;
            font-size: 1.8rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5a67d8; }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover { background: #38a169; }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover { background: #e53e3e; }
        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            font-weight: 600;
            color: #4a5568;
            background: #f7fafc;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-1 { background: #c6f6d5; color: #22543d; }
        .status-0 { background: #fed7d7; color: #742a2a; }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #718096;
        }
        .points {
            color: #ed8936;
            font-weight: bold;
        }
        .stock {
            color: #4299e1;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">社区志愿服务管理系统</div>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/admin/dashboard">数据看板</a>
            <a href="/admin/user/pending">用户审核</a>
            <a href="/activity/admin/list">公益活动</a>
            <a href="/reward/admin/list">积分商城</a>
            <a href="/admin/sos">紧急求助</a>
            <a href="/admin/create">👑 创建管理员</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">积分商城管理</h1>
            <a href="/reward/admin/create" class="btn btn-primary">添加奖励</a>
        </div>

        <div class="card">
            <table th:if="${not #lists.isEmpty(rewards)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>奖励名称</th>
                        <th>类型</th>
                        <th>所需积分</th>
                        <th>库存</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reward : ${rewards}">
                        <td th:text="${reward.id}"></td>
                        <td th:text="${reward.name}"></td>
                        <td th:text="${reward.type}"></td>
                        <td class="points" th:text="${reward.points} + ' 积分'"></td>
                        <td class="stock" th:text="${reward.stock}"></td>
                        <td>
                            <span class="status-badge" th:classappend="'status-' + ${reward.status}"
                                  th:text="${reward.status == 1 ? '上架中' : '已下架'}">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/reward/admin/edit/{id}(id=${reward.id})}" class="btn btn-primary btn-sm">编辑</a>
                            <button class="btn btn-success btn-sm" th:onclick="'toggleStatus(' + ${reward.id} + ', ' + ${reward.status} + ')'" th:text="${reward.status == 1 ? '下架' : '上架'}"></button>
                            <button class="btn btn-danger btn-sm" th:onclick="'deleteReward(' + ${reward.id} + ')'">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(rewards)}" class="empty-state">
                <h3>暂无奖励商品</h3>
                <p>点击右上角按钮添加奖励</p>
            </div>
        </div>
    </div>

    <script>
        function deleteReward(rewardId) {
            if (confirm('确定要删除该奖励吗？')) {
                fetch('/reward/admin/delete/' + rewardId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload();
                        } else {
                            alert(data.message);
                        }
                    });
            }
        }
        
        function toggleStatus(rewardId, currentStatus) {
            const action = currentStatus === 1 ? '下架' : '上架';
            if (confirm('确定要' + action + '该奖励吗？')) {
                const newStatus = currentStatus === 1 ? 0 : 1;
                fetch('/reward/admin/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: rewardId, status: newStatus })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        window.location.reload();
                    } else {
                        alert(data.message);
                    }
                });
            }
        }
    </script>
</body>
</html>
