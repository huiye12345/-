<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的兑换 - 社区志愿服务管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #333;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: white; }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .page-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            font-weight: 600;
            color: #4a5568;
            background: #f7fafc;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-0 { background: #fef3c7; color: #92400e; }
        .status-1 { background: #c6f6d5; color: #22543d; }
        .status-2 { background: #fed7d7; color: #742a2a; }
        .points {
            color: #ed8936;
            font-weight: bold;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover { background: #e53e3e; }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #718096;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">社区志愿服务管理系统</div>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/volunteer/request">接单服务</a>
            <a href="/volunteer/sos">紧急求助</a>
            <a href="/activity/list">公益活动</a>
            <a href="/reward/list">积分商城</a>
            <a href="/reward/my">我的兑换</a>
            <a href="/ai/assistant">AI助手</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">我的兑换记录</h1>

        <div class="card">
            <table th:if="${not #lists.isEmpty(exchanges)}">
                <thead>
                    <tr>
                        <th>兑换ID</th>
                        <th>奖励名称</th>
                        <th>消耗积分</th>
                        <th>兑换时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exchange : ${exchanges}">
                        <td th:text="${exchange.id}"></td>
                        <td th:text="${exchange.rewardName != null ? exchange.rewardName : '奖励已下架'}"></td>
                        <td class="points" th:text="${exchange.points} + ' 积分'"></td>
                        <td th:text="${#temporals.format(exchange.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <span class="status-badge" th:classappend="'status-' + ${exchange.status}"
                                  th:text="${exchange.status == 0 ? '待处理' : (exchange.status == 1 ? '已完成' : '已取消')}">
                            </span>
                        </td>
                        <td>
                            <button th:if="${exchange.status == 0}" class="btn btn-danger" th:onclick="'cancelExchange(' + ${exchange.id} + ')'">取消</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(exchanges)}" class="empty-state">
                <h3>暂无兑换记录</h3>
                <p>快去积分商城兑换奖励吧！</p>
            </div>
        </div>
    </div>

    <script>
        function cancelExchange(exchangeId) {
            if (confirm('确定要取消该兑换吗？积分将返还到您的账户')) {
                fetch('/reward/cancel/' + exchangeId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload();
                        } else {
                            alert(data.message);
                        }
                    });
            }
        }
    </script>
</body>
</html>
