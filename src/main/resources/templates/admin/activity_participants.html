<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动报名人员 - 社区志愿服务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-header {
            margin-bottom: 30px;
        }
        .page-header h2 {
            color: white;
            margin-bottom: 10px;
        }
        .activity-info {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-0 { background: #ffc107; color: #333; }
        .status-1 { background: #17a2b8; color: white; }
        .status-2 { background: #28a745; color: white; }
        .status-3 { background: #dc3545; color: white; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-card h4 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>社区志愿服务管理系统</h1>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/admin/dashboard">数据看板</a>
            <a href="/admin/user/pending">用户审核</a>
            <a href="/activity/admin/list">公益活动</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2 th:text="${activity.title + ' - 报名人员'}"></h2>
            <div class="activity-info">
                <span th:text="'地点：' + ${activity.location}"></span> | 
                <span th:text="'时间：' + ${activity.activityTime != null ? #temporals.format(activity.activityTime, 'yyyy-MM-dd HH:mm') : '未设置'}"></span> | 
                <span th:text="'积分奖励：' + ${activity.points}"></span>
            </div>
        </div>

        <div class="stats" th:if="${not #lists.isEmpty(participants)}">
            <div class="stat-card">
                <h4>已报名</h4>
                <div class="number" th:text="${participants.?[status == 0].size()}">0</div>
            </div>
            <div class="stat-card">
                <h4>已签到</h4>
                <div class="number" th:text="${participants.?[status == 1].size()}">0</div>
            </div>
            <div class="stat-card">
                <h4>已完成</h4>
                <div class="number" th:text="${participants.?[status == 2].size()}">0</div>
            </div>
            <div class="stat-card">
                <h4>已取消</h4>
                <div class="number" th:text="${participants.?[status == 3].size()}">0</div>
            </div>
        </div>

        <div class="card">
            <a href="/activity/admin/list" class="btn btn-secondary">返回活动列表</a>
            
            <table th:if="${not #lists.isEmpty(participants)}">
                <thead>
                    <tr>
                        <th>报名ID</th>
                        <th>志愿者ID</th>
                        <th>状态</th>
                        <th>签到时间</th>
                        <th>完成时间</th>
                        <th>获得积分</th>
                        <th>报名时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${participants}">
                        <td th:text="${record.id}"></td>
                        <td th:text="${record.userId}"></td>
                        <td>
                            <span class="status-badge" th:classappend="'status-' + ${record.status}"
                                  th:text="${record.status == 0 ? '已报名' : (record.status == 1 ? '已签到' : (record.status == 2 ? '已完成' : '已取消'))}">
                            </span>
                        </td>
                        <td th:text="${record.signInTime != null ? #temporals.format(record.signInTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td th:text="${record.completeTime != null ? #temporals.format(record.completeTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td th:text="${record.pointsEarned > 0 ? record.pointsEarned : '-'}"></td>
                        <td th:text="${#temporals.format(record.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(participants)}" class="empty-state">
                <h3>暂无报名人员</h3>
            </div>
        </div>
    </div>
</body>
</html>
