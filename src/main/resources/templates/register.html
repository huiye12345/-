<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区特殊人群志愿服务管理系统 - 注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .register-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        .user-type-section {
            display: none;
        }
        .user-type-section.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>用户注册</h1>
            <p>请选择您的身份类型进行注册</p>
        </div>
        <div class="alert" id="alert"></div>
        <form id="registerForm">
            <div class="form-group">
                <label for="userType">身份类型 *</label>
                <select id="userType" name="userType" required>
                    <option value="">请选择</option>
                    <option value="1">特殊人群</option>
                    <option value="2">志愿者</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码 *</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="realName">真实姓名 *</label>
                    <input type="text" id="realName" name="realName" required placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                    <label for="phone">联系电话 *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="请输入联系电话">
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">居住地址</label>
                <input type="text" id="address" name="address" placeholder="请输入居住地址">
            </div>
            
            <div class="form-group">
                <label for="idCard">身份证号</label>
                <input type="text" id="idCard" name="idCard" placeholder="请输入身份证号">
            </div>
            
            <div id="specialSection" class="user-type-section">
                <div class="form-group">
                    <label for="emergencyContact">紧急联系人</label>
                    <input type="text" id="emergencyContact" name="emergencyContact" placeholder="请输入紧急联系人姓名">
                </div>
                <div class="form-group">
                    <label for="emergencyPhone">紧急联系电话</label>
                    <input type="tel" id="emergencyPhone" name="emergencyPhone" placeholder="请输入紧急联系电话">
                </div>
                <div class="form-group">
                    <label for="medicalInfo">医疗信息（如有特殊情况请填写）</label>
                    <textarea id="medicalInfo" name="medicalInfo" placeholder="请输入医疗相关信息"></textarea>
                </div>
            </div>
            
            <button type="submit" class="btn-register">提交注册</button>
        </form>
        <div class="login-link">
            <p>已有账号？<a href="/login">立即登录</a></p>
        </div>
    </div>

    <script>
        document.getElementById('userType').addEventListener('change', function() {
            const specialSection = document.getElementById('specialSection');
            if (this.value === '1') {
                specialSection.classList.add('active');
            } else {
                specialSection.classList.remove('active');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('/register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const alert = document.getElementById('alert');
                if (data.success) {
                    alert.className = 'alert alert-success';
                    alert.textContent = data.message;
                    alert.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    alert.className = 'alert alert-error';
                    alert.textContent = data.message;
                    alert.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
