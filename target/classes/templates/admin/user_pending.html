<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户审核 - 社区志愿服务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        .nav-links {
            display: flex;
            gap: 25px;
        }
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #667eea;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .role-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .role-volunteer { background: #667eea; color: white; }
        .role-special { background: #f093fb; color: white; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">社区志愿服务管理系统</div>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/admin/dashboard">数据统计</a>
            <a href="/admin/user/pending">用户审核</a>
            <a href="/admin/volunteer/list">志愿者管理</a>
            <a href="/admin/special/list">特殊人群管理</a>
            <a href="/activity/admin/list">公益活动</a>
            <a href="/reward/admin/list">积分商城</a>
            <a href="/admin/sos">紧急求助</a>
            <a href="/admin/create">👑 创建管理员</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>用户审核</h1>
            <div class="tabs">
                <div class="tab active" onclick="showTab('volunteer')">志愿者审核</div>
                <div class="tab" onclick="showTab('special')">特殊人群审核</div>
            </div>

            <div id="volunteer-tab">
                <table th:if="${not #lists.isEmpty(pendingVolunteers)}">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>姓名</th>
                            <th>电话</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${pendingVolunteers}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.realName}"></td>
                            <td th:text="${user.phone}"></td>
                            <td th:text="${#temporals.format(user.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <button class="btn btn-success" th:onclick="'approve(' + ${user.id} + ')'">通过</button>
                                <button class="btn btn-danger" th:onclick="'reject(' + ${user.id} + ')'">拒绝</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(pendingVolunteers)}">
                    <p>暂无待审核的志愿者</p>
                </div>
            </div>

            <div id="special-tab" style="display: none;">
                <table th:if="${not #lists.isEmpty(pendingSpecialUsers)}">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>姓名</th>
                            <th>电话</th>
                            <th>地址</th>
                            <th>紧急联系人</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${pendingSpecialUsers}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.realName}"></td>
                            <td th:text="${user.phone}"></td>
                            <td th:text="${user.address}"></td>
                            <td th:text="${user.emergencyContact + ' (' + user.emergencyPhone + ')'}"></td>
                            <td>
                                <button class="btn btn-success" th:onclick="'approve(' + ${user.id} + ')'">通过</button>
                                <button class="btn btn-danger" th:onclick="'reject(' + ${user.id} + ')'">拒绝</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(pendingSpecialUsers)}">
                    <p>暂无待审核的特殊人群</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'volunteer') {
                document.getElementById('volunteer-tab').style.display = 'block';
                document.getElementById('special-tab').style.display = 'none';
            } else {
                document.getElementById('volunteer-tab').style.display = 'none';
                document.getElementById('special-tab').style.display = 'block';
            }
        }

        function approve(userId) {
            fetch('/admin/user/approve?userId=' + userId, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('审核通过');
                        window.location.reload();
                    } else {
                        alert(data.message);
                    }
                });
        }

        function reject(userId) {
            fetch('/admin/user/reject?userId=' + userId, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('已拒绝');
                        window.location.reload();
                    } else {
                        alert(data.message);
                    }
                });
        }
    </script>
</body>
</html>
