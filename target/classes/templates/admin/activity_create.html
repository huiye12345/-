<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布公益活动 - 社区志愿服务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .form-actions .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>社区志愿服务管理系统</h1>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/admin/dashboard">数据看板</a>
            <a href="/admin/user/pending">用户审核</a>
            <a href="/activity/admin/list">公益活动</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>发布公益活动</h2>
            <form id="activityForm">
                <div class="form-group">
                    <label for="title">活动标题 *</label>
                    <input type="text" id="title" name="title" required placeholder="请输入活动标题">
                </div>
                
                <div class="form-group">
                    <label for="description">活动描述</label>
                    <textarea id="description" name="description" placeholder="请输入活动描述"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="location">活动地点</label>
                    <input type="text" id="location" name="location" placeholder="请输入活动地点">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="activityTime">活动时间</label>
                        <input type="datetime-local" id="activityTime" name="activityTime">
                    </div>
                    <div class="form-group">
                        <label for="maxParticipants">最大参与人数（0表示不限）</label>
                        <input type="number" id="maxParticipants" name="maxParticipants" value="0" min="0">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="points">积分奖励 *</label>
                        <input type="number" id="points" name="points" required min="0" placeholder="完成活动获得的积分">
                    </div>
                    <div class="form-group">
                        <label for="hours">活动时长（小时）</label>
                        <input type="number" id="hours" name="hours" min="0" placeholder="活动时长">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="status">活动状态</label>
                    <select id="status" name="status">
                        <option value="0">未开始</option>
                        <option value="1">报名中</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <a href="/activity/admin/list" class="btn btn-secondary">返回</a>
                    <button type="submit" class="btn btn-primary">发布活动</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('activityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                activityTime: document.getElementById('activityTime').value,
                maxParticipants: parseInt(document.getElementById('maxParticipants').value) || 0,
                points: parseInt(document.getElementById('points').value) || 0,
                hours: parseInt(document.getElementById('hours').value) || 0,
                status: parseInt(document.getElementById('status').value)
            };
            
            fetch('/activity/admin/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.href = '/activity/admin/list';
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                alert('发布失败，请重试');
            });
        });
    </script>
</body>
</html>
