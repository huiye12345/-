server:
  port: 8080

spring:
  application:
    name: community-volunteer-service
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_volunteer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

file:
  upload:
    path: uploads/
    avatar-path: 头像/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:/mapper/**/*.xml

logging:
  level:
    com.community.mapper: debug

# AI 配置
ai:
  enabled: true
  api-key: 2b1d066483144019b0cfc348a6977dd2.GVnnsoNphqDzvwUz
  base-url: https://open.bigmodel.cn/api/paas/v4
  default-model: glm-4-flash
  max-tokens: 2048
  temperature: 0.7
  timeout: 30
