<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公益活动管理 - 社区志愿服务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-header h2 {
            color: white;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-0 { background: #ffc107; color: #333; }
        .status-1 { background: #17a2b8; color: white; }
        .status-2 { background: #28a745; color: white; }
        .status-3 { background: #6c757d; color: white; }
        .status-4 { background: #dc3545; color: white; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>社区志愿服务管理系统</h1>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/admin/dashboard">数据看板</a>
            <a href="/admin/user/pending">用户审核</a>
            <a href="/activity/admin/list">公益活动</a>
            <a href="/reward/admin/list">积分商城</a>
            <a href="/admin/sos">紧急求助</a>
            <a href="/admin/create">👑 创建管理员</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>公益活动管理</h2>
            <a href="/activity/admin/create" class="btn btn-primary">发布新活动</a>
        </div>

        <div class="card">
            <table th:if="${not #lists.isEmpty(activities)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>活动标题</th>
                        <th>活动地点</th>
                        <th>活动时间</th>
                        <th>参与人数</th>
                        <th>积分奖励</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="activity : ${activities}">
                        <td th:text="${activity.id}"></td>
                        <td th:text="${activity.title}"></td>
                        <td th:text="${activity.location}"></td>
                        <td th:text="${activity.activityTime != null ? #temporals.format(activity.activityTime, 'yyyy-MM-dd HH:mm') : '未设置'}"></td>
                        <td th:text="${activity.currentParticipants + '/' + (activity.maxParticipants > 0 ? activity.maxParticipants : '不限')}"></td>
                        <td th:text="${activity.points}"></td>
                        <td>
                            <span class="status-badge" th:classappend="'status-' + ${activity.status}"
                                  th:text="${activity.status == 0 ? '未开始' : (activity.status == 1 ? '报名中' : (activity.status == 2 ? '进行中' : (activity.status == 3 ? '已结束' : '已取消')))}">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/activity/admin/participants/{id}(id=${activity.id})}" class="btn btn-success btn-sm">查看报名</a>
                            <button th:if="${activity.status == 0 || activity.status == 1}" class="btn btn-primary btn-sm" th:onclick="'startActivity(' + ${activity.id} + ')'">开始活动</button>
                            <button th:if="${activity.status == 2}" class="btn btn-warning btn-sm" th:onclick="'endActivity(' + ${activity.id} + ')'">结束活动</button>
                            <button class="btn btn-danger btn-sm" th:onclick="'deleteActivity(' + ${activity.id} + ')'">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(activities)}" class="empty-state">
                <h3>暂无公益活动</h3>
                <p>点击右上角按钮发布新活动</p>
            </div>
        </div>
    </div>

    <script>
        function deleteActivity(activityId) {
            if (confirm('确定要删除该活动吗？')) {
                fetch('/activity/admin/delete/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload();
                        } else {
                            alert(data.message);
                        }
                    });
            }
        }
        
        function startActivity(activityId) {
            if (confirm('确定要开始该活动吗？开始后志愿者可以签到。')) {
                fetch('/activity/admin/start/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload();
                        } else {
                            alert(data.message);
                        }
                    });
            }
        }
        
        function endActivity(activityId) {
            if (confirm('确定要结束该活动吗？结束后不能再签到。')) {
                fetch('/activity/admin/end/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload();
                        } else {
                            alert(data.message);
                        }
                    });
            }
        }
    </script>
</body>
</html>
