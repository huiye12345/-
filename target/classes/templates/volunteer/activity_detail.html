<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动详情 - 社区志愿服务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #134E5E 0%, #71B280 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .activity-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .activity-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }
        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
        }
        .status-0 { background: #ffc107; color: #333; }
        .status-1 { background: #17a2b8; color: white; }
        .status-2 { background: #28a745; color: white; }
        .status-3 { background: #6c757d; color: white; }
        .status-4 { background: #dc3545; color: white; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .info-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .info-item label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .info-item .value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        .points-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }
        .points-box .label {
            font-size: 14px;
            opacity: 0.9;
        }
        .points-box .value {
            font-size: 36px;
            font-weight: bold;
        }
        .description-section {
            margin-bottom: 30px;
        }
        .description-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .description-section .content {
            color: #555;
            line-height: 1.8;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .action-buttons .btn {
            flex: 1;
        }
        .my-status {
            background: #e3f2fd;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }
        .my-status label {
            color: #666;
            font-size: 14px;
        }
        .my-status .value {
            color: #2196f3;
            font-weight: 600;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>社区志愿服务管理系统</h1>
        <div class="nav-links">
            <a href="/home">首页</a>
            <a href="/request/list">需求大厅</a>
            <a href="/sos/list">紧急求助</a>
            <a href="/activity/list">公益活动</a>
            <a href="/reward/list">积分商城</a>
            <a href="/profile">个人中心</a>
            <a href="/logout">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="activity-header">
                <h1 class="activity-title" th:text="${activity.title}"></h1>
                <span class="status-badge" th:classappend="'status-' + ${activity.status}"
                      th:text="${activity.status == 0 ? '未开始' : (activity.status == 1 ? '报名中' : (activity.status == 2 ? '进行中' : (activity.status == 3 ? '已结束' : '已取消')))}">
                </span>
            </div>

            <div class="my-status" th:if="${record != null}">
                <label>我的状态：</label>
                <span class="value" th:text="${record.status == 0 ? '已报名' : (record.status == 1 ? '已签到' : (record.status == 2 ? '已完成' : '已取消'))}"></span>
            </div>

            <div class="points-box">
                <div class="label">完成活动可获得积分</div>
                <div class="value" th:text="'+' + ${activity.points}"></div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>活动地点</label>
                    <div class="value" th:text="${activity.location != null ? activity.location : '未设置'}"></div>
                </div>
                <div class="info-item">
                    <label>活动时间</label>
                    <div class="value" th:text="${activity.activityTime != null ? #temporals.format(activity.activityTime, 'yyyy-MM-dd HH:mm') : '未设置'}"></div>
                </div>
                <div class="info-item">
                    <label>参与人数</label>
                    <div class="value" th:text="${activity.currentParticipants + '/' + (activity.maxParticipants > 0 ? activity.maxParticipants : '不限')}"></div>
                </div>
                <div class="info-item">
                    <label>活动时长</label>
                    <div class="value" th:text="${activity.hours > 0 ? activity.hours + '小时' : '未设置'}"></div>
                </div>
            </div>

            <div class="description-section">
                <h3>活动描述</h3>
                <div class="content" th:text="${activity.description != null ? activity.description : '暂无描述'}"></div>
            </div>

            <div class="action-buttons">
                <a href="/activity/list" class="btn btn-secondary">返回列表</a>
                
                <button th:if="${record == null && (activity.status == 0 || activity.status == 1)}" 
                        class="btn btn-primary" onclick="joinActivity()">立即报名</button>
                
                <button th:if="${record != null && record.status == 0}" 
                        class="btn btn-danger" onclick="cancelActivity()">取消报名</button>
                
                <button th:if="${record != null && record.status == 0}" 
                        class="btn btn-warning" onclick="signInActivity()">签到</button>
                
                <button th:if="${record != null && record.status == 1}" 
                        class="btn btn-success" onclick="completeActivity()">完成活动</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        var activityId = [[${activity.id}]];
        
        function joinActivity() {
            if (confirm('确定要报名参加该活动吗？')) {
                fetch('/activity/join/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
        
        function cancelActivity() {
            if (confirm('确定要取消报名吗？')) {
                fetch('/activity/cancel/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
        
        function signInActivity() {
            if (confirm('确定要签到吗？')) {
                fetch('/activity/signin/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
        
        function completeActivity() {
            if (confirm('确定要完成该活动吗？完成后将获得积分奖励。')) {
                fetch('/activity/complete/' + activityId, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
    </script>
</body>
</html>
